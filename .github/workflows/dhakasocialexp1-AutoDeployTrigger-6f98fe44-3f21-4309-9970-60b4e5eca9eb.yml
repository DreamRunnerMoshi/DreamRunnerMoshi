name: Trigger auto deployment for dhakasocialexp1

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/dhakasocialexp1-AutoDeployTrigger-6f98fe44-3f21-4309-9970-60b4e5eca9eb.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.DHAKASOCIALEXP1_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DHAKASOCIALEXP1_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DHAKASOCIALEXP1_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: dhakasocial1.azurecr.io
          registryUsername: ${{ secrets.DHAKASOCIALEXP1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.DHAKASOCIALEXP1_REGISTRY_PASSWORD }}
          containerAppName: dhakasocialexp1
          resourceGroup: dhaka_social_exp1
          imageToBuild: dhakasocial1.azurecr.io/dhakasocialexp1:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


